<html>
  <head>
    <title>Brick Wall Canvas</title>
  </head>
  <body>
    <canvas
      style="background-color:aquamarine"
      id="canvas1"
      width="800"
      height="500"
    ></canvas>
  </body>
  <script>
    const canvas = document.getElementById("canvas1");
    const ctx = canvas.getContext("2d");

    // Brick wall parameters
    const brickWidth = 60;
    const brickHeight = 30;
    const mortarThickness = 3;
    const wallStartX = 100;
    const wallStartY = 100;
    const wallWidth = 12; // number of bricks per full row
    const wallHeight = 10; // number of rows

    // Brick color (reddish-orange)
    ctx.fillStyle = "#CD853F";

    // Draw the brick wall (rectangular, trimmed edges)
    for (let row = 0; row < wallHeight; row++) {
      for (let col = 0; col < wallWidth; col++) {
        let x = wallStartX + col * (brickWidth + mortarThickness);
        let y = wallStartY + row * (brickHeight + mortarThickness);

        // Offset every other row
        if (row % 2 === 1) {
          x += (brickWidth + mortarThickness) / 2;
        }

        // Skip bricks that exceed wall width
        if (x + brickWidth > wallStartX + wallWidth * (brickWidth + mortarThickness)) {
          continue;
        }

        // Adjust first and last brick of offset rows (half bricks)
        let adjustedWidth = brickWidth;

        if (row % 2 === 1) {
          // Leftmost half brick
          if (col === 0) {
            x = wallStartX;
            adjustedWidth = brickWidth / 2 - mortarThickness / 2;
          }
          // Rightmost half brick
          else if (x + brickWidth > wallStartX + wallWidth * (brickWidth + mortarThickness) - (brickWidth / 2)) {
            adjustedWidth = brickWidth / 2 - mortarThickness / 2;
          }
        }

        // Draw the brick
        ctx.fillRect(x, y, adjustedWidth, brickHeight);
      }
    }

    // Mortar color
    ctx.fillStyle = "black";

    // Horizontal mortar lines
    for (let row = 0; row <= wallHeight; row++) {
      let y = wallStartY + row * (brickHeight + mortarThickness) - mortarThickness;
      ctx.fillRect(
        wallStartX - mortarThickness,
        y,
        wallWidth * (brickWidth + mortarThickness),
        mortarThickness
      );
    }

    // Vertical mortar lines (with offset pattern)
    for (let row = 0; row < wallHeight; row++) {
      let y = wallStartY + row * (brickHeight + mortarThickness);
      let offset = row % 2 === 1 ? (brickWidth + mortarThickness) / 2 : 0;

      for (let col = 0; col <= wallWidth; col++) {
        let x = wallStartX + col * (brickWidth + mortarThickness) + offset - mortarThickness;
        if (x < wallStartX || x > wallStartX + wallWidth * (brickWidth + mortarThickness)) continue;
        ctx.fillRect(x, y, mortarThickness, brickHeight);
      }
    }
  </script>
</html>
